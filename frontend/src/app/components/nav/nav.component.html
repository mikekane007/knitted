<nav class="navbar">
  <div class="nav-container">
    <!-- Logo and Location -->
    <div class="brand-section">
      <a routerLink="/" class="brand">
        <img src="logo.png" alt="Knitted Logo" class="brand-logo-img" />
        <span class="brand-text">Knitted<span class="dot">.</span></span>
      </a>

      <!-- Location Badge -->
      <div class="location-pill">
        <i class="fa-solid fa-location-dot location-icon"></i>
        <span>{{ userCity }}</span>
      </div>

      <!-- Navigation links -->
      <a routerLink="/events" class="nav-link-item" routerLinkActive="active">Gatherings</a>
      <a routerLink="/hubs" class="nav-link-item" routerLinkActive="active">Channels</a>
    </div>

    <!-- Search and Action Buttons -->
    <div class="action-section">
      <!-- + Host button -->
      <button class="btn-host" routerLink="/publish">
        <i class="fa-solid fa-plus"></i> Host
      </button>

      <!-- User profile or login/register links -->
      <div class="auth-box">
        <ng-container *ngIf="isLoggedIn; else loginButtons">
          <div class="user-profile-menu" (click)="toggleDropdown()">
            <img [src]="avatarUrl" alt="Avatar" class="avatar-img" />
            
            <div class="dropdown-menu" *ngIf="showDropdown">
              <div class="dropdown-header">{{ userEmail }}</div>
              <a routerLink="/profile" class="dropdown-item">My Profile & Passes</a>
              <button (click)="logout()" class="dropdown-item logout-btn">Logout</button>
            </div>
          </div>
        </ng-container>
        
        <ng-template #loginButtons>
          <a routerLink="/login" class="btn-login-light">Login</a>
          <a routerLink="/register" class="btn-register-light">Register</a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>

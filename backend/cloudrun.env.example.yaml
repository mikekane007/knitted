# Copy to cloudrun.env.yaml and set real values before deploying.
# Cloud Run reads these as environment variables.
DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/DATABASE?sslmode=require"
JWT_SECRET: "replace-with-a-random-secret-at-least-32-characters"
JWT_ISSUER: "KnittedApi"
JWT_AUDIENCE: "KnittedClient"
JWT_EXPIRY_MINUTES: "60"
PUBLIC_API_URL: "https://YOUR-CLOUD-RUN-SERVICE-URL"
FRONTEND_URL: "https://mikekane007.github.io/knitted"
CORS_ALLOWED_ORIGINS: "https://mikekane007.github.io,http://localhost:4200"
GOOGLE_CLIENT_ID: "YOUR-GOOGLE-CLIENT-ID.apps.googleusercontent.com"
GOOGLE_CLIENT_SECRET: "YOUR-GOOGLE-CLIENT-SECRET"
APIFY_API_TOKEN: "YOUR_APIFY_API_TOKEN"

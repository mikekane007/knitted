services:
  postgres:
    image: postgres:16-alpine
    container_name: knitted_postgres
    environment:
      POSTGRES_DB: knitted
      POSTGRES_USER: knitted
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-knitted-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
